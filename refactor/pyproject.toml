[project]
name = "android-control-refactor"
version = "0.1.0"
description = "Focused Android device media control plane"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi[standard]>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
android_control = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
