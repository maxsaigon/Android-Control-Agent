services:
  app:
    build: .
    ports:
      - "8001:8080"
    env_file:
      - .env
    environment:
      - RUNTIME_DATA_DIR=/app
    volumes:
      # Persist SQLite database
      - ./data:/app/data
      # Persist screenshots
      - ./screenshots:/app/screenshots
      # Persist ADB keys across rebuilds (prevents repeated unauthorized state)
      - ${HOME}/.android:/root/.android
      # Mount templates (editable without rebuild)
      - ./app/templates:/app/app/templates
      # Mount config (editable without rebuild)
      - ./config.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
