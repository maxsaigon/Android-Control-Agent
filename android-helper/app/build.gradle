plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def helperArtifactBaseName = "android-control-helper"

def gitBuildRef() {
    try {
        def shaProc = ["git", "rev-parse", "--short", "HEAD"].execute(null, rootDir.parentFile)
        shaProc.waitFor()
        def sha = shaProc.exitValue() == 0 ? shaProc.text.trim() : "nogit"

        def dirtyProc = ["git", "status", "--porcelain"].execute(null, rootDir.parentFile)
        dirtyProc.waitFor()
        if (dirtyProc.exitValue() == 0 && !dirtyProc.text.trim().isEmpty()) {
            return sha + "-dirty"
        }
        return sha
    } catch (Exception ignored) {
    }
    return "nogit"
}

def buildTimeUtc() {
    return new Date().format("yyyyMMdd-HHmmss", java.util.TimeZone.getTimeZone("UTC"))
}

android {
    namespace 'com.androidcontrol.helper'
    compileSdk 35

    defaultConfig {
        applicationId "com.androidcontrol.helper"
        minSdk 28          // Android 9+ (screencap global action requires API 28)
        targetSdk 33
        versionCode 6
        versionName "1.3.0"

        buildConfigField "String", "HELPER_RELEASE_NAME", "\"${helperArtifactBaseName}\""
        buildConfigField "String", "HELPER_BUILD_SHA", "\"${gitBuildRef()}\""
        buildConfigField "String", "HELPER_BUILD_TIME_UTC", "\"${buildTimeUtc()}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${helperArtifactBaseName}-v${variant.versionName}+${variant.versionCode}.apk"
        }
    }
}

dependencies {
    // WebSocket server
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'

    // JSON processing
    implementation 'com.google.code.gson:gson:2.10.1'

    // WebRTC screen publishing
    implementation 'io.livekit:livekit-android:2.27.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
